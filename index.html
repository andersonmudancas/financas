<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Cloud V12 - Firebase Sync</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #27ae60; --danger: #e74c3c; --warning: #f39c12; --info: #2980b9; --dark: #2c3e50; --bg: #f4f7f6; --purple: #8e44ad; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--dark); }
        #tela-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 300px; }
        .login-box input { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        #conteudo-principal { display: none; padding: 20px; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 15px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .dashboard-cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 30px; border-top: 1px dashed #ccc; padding-top: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; text-align: center; }
        .card h4 { margin: 0 0 10px 0; font-size: 0.85em; text-transform: uppercase; opacity: 0.9; }
        .card p { margin: 0; font-size: 1.2em; font-weight: bold; }
        .rec-recebida { background: var(--primary); }
        .rec-pendente { background: #1abc9c; }
        .des-paga { background: var(--info); }
        .des-pendente { background: var(--danger); }
        .saldo-total { background: #2980b9; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .card-cartao { background: var(--purple); }
        .section { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        button { cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-size: 13px; color: #666; }
        .linha-paga { background-color: #e8f5e9 !important; }
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .tag-pendente { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .tag-pago { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    </style>
</head>
<body>

<div id="tela-login">
    <div class="login-box">
        <h2 id="titulo-login">Cloud Login</h2>
        <input type="password" id="campo-senha" placeholder="Senha da Nuvem">
        <button onclick="verificarLogin()" class="btn-add" style="width: 100%;">SINCRONIZAR E ENTRAR</button>
    </div>
</div>

<div id="conteudo-principal">
    <div class="container">
        <div class="header-flex">
            <div>
                <h2 style="margin:0">☁️ Finanças em Nuvem V12</h2>
                <small id="status-sync" style="color: var(--primary);">● Sincronizado com Firebase</small>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <strong>Mês:</strong>
                <input type="month" id="filtroMes" onchange="renderizar()">
                <button onclick="location.reload()" style="background:#ddd;">SAIR</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="card rec-recebida"><h4>Recebido</h4><p id="total-rec-ok">R$ 0,00</p></div>
            <div class="card rec-pendente"><h4>Rec. Pendente</h4><p id="total-rec-pen">R$ 0,00</p></div>
            <div class="card des-paga"><h4>Despesa Paga</h4><p id="total-des-ok">R$ 0,00</p></div>
            <div class="card des-pendente"><h4>Despesa Pendente</h4><p id="total-des-pen">R$ 0,00</p></div>
            <div class="card saldo-total"><h4>Saldo Efetivado (Caixa)</h4><p id="total-saldo">R$ 0,00</p></div>
        </div>

        <div class="dashboard-cartoes" id="dash-cartoes"></div>

        <div class="section">
            <div class="grid-form">
                <input type="text" id="nomeCartao" placeholder="Nome do Cartão">
                <input type="number" id="vencimentoCartao" placeholder="Dia Vencimento">
                <button class="btn-add" style="background:var(--purple)" onclick="adicionarCartao()">+ NOVO CARTÃO</button>
            </div>
            <div id="listaCartoes" style="margin-top:10px; font-size: 12px; color: #7f8c8d;"></div>
            <hr style="margin: 15px 0; border:0; border-top:1px solid #ddd;">
            <div class="grid-form">
                <input type="text" id="desc" placeholder="Descrição">
                <input type="number" id="valor" placeholder="Valor">
                <select id="tipo" onchange="toggleCartao()">
                    <option value="fixo">Dinheiro / Fixo</option>
                    <option value="cartao">Cartão de Crédito</option>
                    <option value="receita">Receita (Ganho)</option>
                </select>
                <select id="selectCartao" style="display:none;"></select>
                <input type="number" id="parcelas" value="1" min="1">
                <input type="date" id="dataBase">
                <button class="btn-add" onclick="adicionarLancamento()">LANÇAR</button>
            </div>
        </div>

        <table>
            <thead>
                <tr><th>STATUS</th><th>DESCRIÇÃO</th><th>ORIGEM</th><th>VALOR</th><th>VENCIMENTO</th><th>AÇÕES</th></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
   // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAGX9hNRPCQ26uYh_DI-jbvnHjqMibZk58",
  authDomain: "financeiro-f9676.firebaseapp.com",
  projectId: "financeiro-f9676",
  storageBucket: "financeiro-f9676.firebasestorage.app",
  messagingSenderId: "108917683728",
  appId: "1:108917683728:web:7e3b18d211c8257b66bc95"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
    const db = firebase.database();

    let lancamentos = [];
    let cartoes = [];
    let senhaSalva = "";

    function salvar() {
        db.ref('meuFinanceiro').set({ lancamentos, cartoes, senhaSalva });
    }

    function carregar() {
        db.ref('meuFinanceiro').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                lancamentos = data.lancamentos || [];
                cartoes = data.cartoes || [];
                senhaSalva = data.senhaSalva || "";
                if(senhaSalva) document.getElementById('titulo-login').innerText = "Acesso Restrito";
                renderizar();
            }
        });
    }

    function verificarLogin() {
        const pass = document.getElementById('campo-senha').value;
        if(!senhaSalva) { senhaSalva = pass; salvar(); }
        if(pass === senhaSalva) {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('conteudo-principal').style.display = 'block';
            carregar();
        } else alert("Senha Incorreta!");
    }

    // --- FUNÇÕES DE INTERAÇÃO ---
    function toggleCartao() {
        const tipo = document.getElementById('tipo').value;
        document.getElementById('selectCartao').style.display = (tipo === 'cartao') ? 'block' : 'none';
    }

    function adicionarCartao() {
        const n = document.getElementById('nomeCartao');
        const d = document.getElementById('vencimentoCartao');
        if(!n.value || !d.value) return;
        cartoes.push({nome: n.value.toUpperCase(), dia: parseInt(d.value)});
        n.value = ''; d.value = ''; salvar();
    }

    function excluirCartao(index) {
        if(confirm("Excluir cartão?")) { cartoes.splice(index, 1); salvar(); }
    }

    function adicionarLancamento() {
        const desc = document.getElementById('desc');
        const valorInp = document.getElementById('valor');
        const tipo = document.getElementById('tipo');
        const parc = document.getElementById('parcelas');
        const data = document.getElementById('dataBase');
        const cart = document.getElementById('selectCartao');

        if(!desc.value || !valorInp.value || !data.value) return alert("Preencha tudo!");

        let valorUnit = parseFloat(valorInp.value);
        const numParc = parseInt(parc.value);

        if(numParc > 1) {
            if(confirm(`R$ ${valorUnit.toFixed(2)} é o TOTAL?`)) valorUnit /= numParc;
        }

        const dataCompra = new Date(data.value + "T00:00:00");
        let mesOffset = 0;
        if(tipo.value === 'cartao') {
            const c = cartoes.find(x => x.nome === cart.value);
            if(c && dataCompra.getDate() > c.dia) mesOffset = 1;
        }

        const idG = Date.now();
        for(let i = 0; i < numParc; i++) {
            let dt = new Date(data.value + "T00:00:00");
            dt.setMonth(dt.getMonth() + i + mesOffset);
            if(tipo.value === 'cartao') {
                const c = cartoes.find(x => x.nome === cart.value);
                if(c) dt.setDate(c.dia);
            }
            lancamentos.push({
                id: idG + i, idGrupo: idG, desc: numParc > 1 ? `${desc.value} (${i+1}/${numParc})` : desc.value,
                descBase: desc.value, valor: valorUnit, tipo: tipo.value,
                origem: tipo.value === 'cartao' ? cart.value : (tipo.value === 'receita' ? 'Entrada' : 'Dinheiro'),
                vencimento: dt.toISOString().substring(0, 10), pago: false
            });
        }
        desc.value = ''; valorInp.value = ''; salvar();
    }

    function alternarStatus(id) {
        const idx = lancamentos.findIndex(l => l.id === id);
        lancamentos[idx].pago = !lancamentos[idx].pago;
        salvar();
    }

    function deletar(id) {
        const item = lancamentos.find(l => l.id === id);
        const parcelas = lancamentos.filter(l => l.idGrupo === item.idGrupo && l.idGrupo !== undefined);
        if (parcelas.length > 1) {
            if (confirm("Excluir TODAS as parcelas?")) lancamentos = lancamentos.filter(l => l.idGrupo !== item.idGrupo);
            else lancamentos = lancamentos.filter(l => l.id !== id);
        } else {
            if(confirm("Excluir?")) lancamentos = lancamentos.filter(l => l.id !== id);
        }
        salvar();
    }

    function renderizar() {
        const mes = document.getElementById('filtroMes').value;
        const corpo = document.getElementById('corpoTabela');
        const selC = document.getElementById('selectCartao');
        const listC = document.getElementById('listaCartoes');
        const dashCartoes = document.getElementById('dash-cartoes');
        
        selC.innerHTML = '<option value="">Escolha o Cartão</option>';
        listC.innerHTML = '<strong>Cartões:</strong> ';
        dashCartoes.innerHTML = ''; 

        let gastosPorCartao = {};
        cartoes.forEach((c, idx) => {
            selC.innerHTML += `<option value="${c.nome}">${c.nome}</option>`;
            listC.innerHTML += `<span class="cartao-item">${c.nome} (dia ${c.dia}) <span style="cursor:pointer;color:red" onclick="excluirCartao(${idx})">×</span></span>`;
            gastosPorCartao[c.nome] = 0;
        });

        let rOK = 0, rPEN = 0, dOK = 0, dPEN = 0;
        corpo.innerHTML = '';

        lancamentos.filter(l => l.vencimento.startsWith(mes)).sort((a,b) => new Date(a.vencimento) - new Date(b.vencimento)).forEach(l => {
            if(l.tipo === 'receita') l.pago ? rOK += l.valor : rPEN += l.valor;
            else {
                l.pago ? dOK += l.valor : dPEN += l.valor;
                if(l.tipo === 'cartao' && gastosPorCartao[l.origem] !== undefined) gastosPorCartao[l.origem] += l.valor;
            }

            corpo.innerHTML += `
                <tr class="${l.pago ? 'linha-paga' : ''}">
                    <td><span class="tag ${l.pago ? 'tag-pago' : 'tag-pendente'}">${l.pago ? 'OK' : 'PENDENTE'}</span></td>
                    <td>${l.desc}</td><td>${l.origem}</td><td>R$ ${l.valor.toFixed(2)}</td><td>${l.vencimento.split('-').reverse().join('/')}</td>
                    <td>
                        <button style="background:var(--primary);color:white" onclick="alternarStatus(${l.id})">${l.pago ? 'Reabrir' : '✔ OK'}</button>
                        <button style="color:var(--danger);background:none" onclick="deletar(${l.id})">🗑</button>
                    </td>
                </tr>`;
        });

        for (let nome in gastosPorCartao) {
            dashCartoes.innerHTML += `<div class="card card-cartao"><h4>Fatura ${nome}</h4><p>R$ ${gastosPorCartao[nome].toFixed(2)}</p></div>`;
        }

        document.getElementById('total-rec-ok').innerText = `R$ ${rOK.toFixed(2)}`;
        document.getElementById('total-rec-pen').innerText = `R$ ${rPEN.toFixed(2)}`;
        document.getElementById('total-des-ok').innerText = `R$ ${dOK.toFixed(2)}`;
        document.getElementById('total-des-pen').innerText = `R$ ${dPEN.toFixed(2)}`;
        
        // --- LÓGICA DE SALDO EFETIVADO SOLICITADA ---
        // Saldo = (Tudo o que já recebi) - (Tudo o que já paguei)
        document.getElementById('total-saldo').innerText = `R$ ${(rOK - dOK).toFixed(2)}`;
    }
    
    document.getElementById('filtroMes').value = new Date().toISOString().substring(0, 7);
</script>
</body>
</html>
